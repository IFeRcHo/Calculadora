<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/main.js" defer></script>
</head>
<body>
    
    <div class="contenedorprincipal">
        <div class="contenedor_pantalla">
            <input type="text" id="values" class="text_values" >
        </div>
        <div class="contenedor_botones">
            <button class="boton operador" id="clear" data-value="C">C</button>
            <button class="boton operador" id="divide" data-value="/">/</button>
            <button class="boton operador" id="percent" data-value="%">%</button>
            <button class="boton operador" id="subtract" data-value="-">-</button>
            

            <button class="boton" id="7" data-value="7">7</button>
            <button class="boton" id="8" data-value="8">8</button>
            <button class="boton" id="9" data-value="9">9</button>
            <button class="boton operador multi" id="multiply" data-value="*">*</button>
            

            <button class="boton" id="4" data-value="4">4</button>
            <button class="boton" id="5" data-value="5">5</button>
            <button class="boton" id="6" data-value="6">6</button>
           

            <button class="boton" id="1"  data-value="1">1</button>
            <button class="boton" id="2" data-value="2">2</button>
            <button class="boton" id="3" data-value="3">3</button>
            
            
            <button class="boton operador suma" id="add" data-value="+">+</button>
            <button class="boton operador" id="decimal" data-value=".">.</button>
            <button class="boton cero" id="0" data-value="0">0</button>
             <button class="boton igual operador" id="equals" data-value="=">=</button>
            
        </div>
    </div>

</body>
</html>
